<!doctype html>
<html>
<head><meta charset="utf-8"><title>drm chrome differential</title></head>
<body>
<script src="/__shaka-debug.js"></script>
<script>
window.__last = { steps: [], done: false };
window.addEventListener("unhandledrejection", (e) => {
  window.__last.unhandled = String((e.reason && e.reason.message) || e.reason).slice(0, 200);
});
window.__run = async function () {
  const out = window.__last;
  const step = (s) => { out.steps.push(s); };
  const race = (p, ms, what) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(what + " timeout")), ms))]);
  try {
    step("start");
    const r = await fetch("/api/video?id=2148966966&source=soundcloud");
    const t = await r.json();
    out.audioType = t.audioType;
    const license = t.drmLicenseUrl || "";
    const proxied = "/api/license-proxy?url=" + encodeURIComponent(license);
    step("video-ok");

    const probe = await navigator.requestMediaKeySystemAccess("com.widevine.alpha", [{
      initDataTypes: ["cenc"], audioCapabilities: [{ contentType: 'audio/mp4;codecs="mp4a.40.2"' }],
      videoCapabilities: [{ contentType: 'video/mp4;codecs="avc1.42E01E"' }],
    }]);
    out.cdm = probe.keySystem;
    step("cdm-ok");

    out.shakaVersion = (window.shaka && shaka.Player && shaka.Player.version) || null;
    out.hasAttach = window.shaka && shaka.Player ? typeof shaka.Player.prototype.attach : "no-shaka";
    shaka.polyfill.installAll();
    step("polyfill-ok");
    out.supported = shaka.Player.isBrowserSupported();
    step("supported-" + out.supported);

    const media = document.createElement("audio");
    media.style.cssText = "position:fixed;left:8px;bottom:8px;width:48px;z-index:99999";
    document.body.appendChild(media);

    step("player-new");
    const player = new shaka.Player();
    step("player-created");
    try {
      await race(player.attach(media), 8000, "attach");
      step("attached");
    } catch (e) {
      out.attachError = String(e.message || e).slice(0, 160);
      out.done = true;
      return out;
    }

    player.configure({
      drm: {
        servers: { "com.widevine.alpha": new URL(proxied, location.origin).toString() },
        advanced: { "com.widevine.alpha": { videoRobustness: ["SW_SECURE_CRYPTO"], audioRobustness: ["SW_SECURE_CRYPTO"] } },
        retryParameters: { maxAttempts: 1 },
      },
      streaming: { retryParameters: { maxAttempts: 2 } },
      abr: { enabled: false },
    });
    player.addEventListener("error", (e) => {
      out.shakaError = { code: e.detail && e.detail.code, msg: String((e.detail && e.detail.message) || "").slice(0, 200) };
    });
    step("configured");
    try { await race(player.load(t.audioUrl), 25000, "load"); out.loaded = true; }
    catch (e) { out.loaded = false; out.loadError = String(e.message || e).slice(0, 220); }
    step("load-done");
    if (out.loaded) {
      out.duration = media.duration;
      try { await race(media.play(), 8000, "play"); } catch (e) { out.playErr = String(e.message || e).slice(0, 120); }
      for (let i = 0; i < 4; i++) {
        await new Promise((res) => setTimeout(res, 1200));
        out["t" + i] = { ct: Math.round(media.currentTime * 100) / 100, rs: media.readyState, paused: media.paused };
      }
    }
    out.done = true;
    return out;
  } catch (e) {
    out.error = String((e && e.message) || e).slice(0, 300);
    out.done = true;
    return out;
  }
};
</script>
</body>
</html>
