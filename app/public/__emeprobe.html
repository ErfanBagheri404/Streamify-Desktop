<!doctype html>
<html><head><meta charset="utf-8"><title>eme probe</title></head>
<body><h1 id="h">eme probe</h1>
<script>
const out = { steps: [], done: false };
window.__last = out;
const step = (k, v) => { out.steps.push({ k, ...(v === undefined ? {} : { v }) }); };
const parse = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

(async () => {
  try {
    step('start', navigator.userAgent);
    const vr = await (await fetch('/api/video?id=2148966966&source=soundcloud', { headers: { Origin: location.origin } })).json();
    step('video', { audioType: vr.audioType, scheme: vr.drmScheme, lic: !!vr.drmLicenseUrl });
    const man = await (await fetch(vr.audioUrl)).text();
    const m = man.match(/#EXT-X-KEY:METHOD=[^,]+,URI="data:text\/plain;base64,([^"]+)"/);
    if (!m) throw new Error('no widevine key uri');
    const pssh = parse(m[1]);
    step('pssh', pssh.byteLength);

    let access;
    const base = [{
      initDataTypes: ['cenc'],
      audioCapabilities: [{ contentType: 'audio/mp4; codecs="mp4a.40.2"' }],
    }];
    try {
      access = await navigator.requestMediaKeySystemAccess('com.widevine.alpha',
        base.map(c => ({ ...c, audioCapabilities: c.audioCapabilities.map(a => ({ ...a, robustness: 'SW_SECURE_CRYPTO' })) })));
      step('access', 'SW_SECURE_CRYPTO');
    } catch (e1) {
      access = await navigator.requestKeySystemAccess ? null : await navigator.requestMediaKeySystemAccess('com.widevine.alpha', base);
      step('access', 'default');
    }
    const media = document.createElement('audio');
    document.body.appendChild(media);
    const keys = await access.createMediaKeys();
    await media.setMediaKeys(keys);
    step('keys', 'set');

    const sess = keys.createSession();
    const result = new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error('timeout')), 30000);
      sess.addEventListener('message', async (ev) => {
        step('challenge', ev.message.byteLength);
        if (ev.message.byteLength > 100) { let s=''; ev.message.forEach(b=>s+=String.fromCharCode(b)); out.challengeB64 = btoa(s); }
        const r = await fetch(vr.drmLicenseUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: ev.message,
        });
        const buf = await r.arrayBuffer();
        step('licenseResp', { status: r.status, bytes: buf.byteLength });
        if (!r.ok) { clearTimeout(t); resolve({ ok: false, status: r.status, body: new TextDecoder().decode(buf.slice(0, 40)) }); return; }
        try { await sess.update(buf); step('update', 'ok'); clearTimeout(t); resolve({ ok: true }); }
        catch (e) { clearTimeout(t); resolve({ ok: false, updateErr: String(e) }); }
      });
      sess.addEventListener('keystatuseschange', () => {
        out.statuses = [...sess.statuses];
      });
    });
    await sess.generateRequest('cenc', pssh);
    step('generateRequest', 'sent');
    out.result = await result;
    out.statuses = [...sess.statuses];
  } catch (e) {
    out.error = String(e && e.stack || e);
  } finally {
    out.done = true;
    document.getElementById('h').textContent = JSON.stringify(out).slice(0, 500);
  }
})();
</script></body></html>
