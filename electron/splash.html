<!doctype html>
<html>
<head>
<meta charset="utf8"/>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center}
  /* Exact loading.dev/atom geometry (CSS 3D rings, not SVG), inlined so the
     packaged app ships no extra dependency.
     size=large(128px), duration=1700ms, linear, opacity 1. */
  .ld-atom{position:relative;width:var(--ld-size,128px);height:var(--ld-size,128px);opacity:1}
  .ld-atom-shell{position:absolute;inset:0;box-sizing:border-box;
    border:calc(var(--ld-size,128px) * 0.055) solid currentColor;border-radius:9999px}
  .ld-atom-orbit{position:absolute;inset:0;transform-style:preserve-3d;
    transform:rotate(var(--ld-atom-tilt)) rotateX(90deg)}
  .ld-atom-ring{position:absolute;inset:0;box-sizing:border-box;
    border:calc(var(--ld-size,128px) * 0.045) solid currentColor;border-radius:9999px;
    transform:rotateX(90deg)}
  .ld-atom-spin{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:center;
    animation:ld-atom-rotate var(--ld-duration,1700ms) linear infinite;
    animation-delay:calc(var(--ld-duration,1700ms) * (var(--ld-step) - 3) / 3);
    animation-play-state:running}
  @keyframes ld-atom-rotate{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.ld-atom-spin{animation:none;transform:rotate(60deg)}}
</style>
</head>
<body>
<div class="ld-atom" style="--ld-size:128px;--ld-duration:1700ms" aria-hidden="true">
  <div class="ld-atom-shell"></div>
  <div class="ld-atom-orbit" style="--ld-atom-tilt:0deg">
    <div class="ld-atom-spin" style="--ld-step:0"><div class="ld-atom-ring"></div></div>
  </div>
  <div class="ld-atom-orbit" style="--ld-atom-tilt:60deg">
    <div class="ld-atom-spin" style="--ld-step:1"><div class="ld-atom-ring"></div></div>
  </div>
  <div class="ld-atom-orbit" style="--ld-atom-tilt:120deg">
    <div class="ld-atom-spin" style="--ld-step:2"><div class="ld-atom-ring"></div></div>
  </div>
</div>
</body>
</html>
